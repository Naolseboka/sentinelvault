syntax = "proto3";

package sentinelvault.audit.v1;

option go_package = "github.com/sentinelvault/sentinelvault/gen/audit/v1;auditv1";

message ComplianceReport {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string status = 4;
}

message ListComplianceReportsRequest {
  string org_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListComplianceReportsResponse {
  repeated ComplianceReport items = 1;
}

service ComplianceService {
  rpc ListComplianceReports(ListComplianceReportsRequest) returns (ListComplianceReportsResponse);
}
