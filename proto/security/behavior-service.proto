syntax = "proto3";

package sentinelvault.security.v1;

option go_package = "github.com/sentinelvault/sentinelvault/gen/security/v1;securityv1";

message BehaviorEvent {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string status = 4;
}

message ListBehaviorEventsRequest {
  string org_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListBehaviorEventsResponse {
  repeated BehaviorEvent items = 1;
}

service BehaviorService {
  rpc ListBehaviorEvents(ListBehaviorEventsRequest) returns (ListBehaviorEventsResponse);
}
