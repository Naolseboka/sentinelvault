syntax = "proto3";

package sentinelvault.vault.v1;

option go_package = "github.com/sentinelvault/sentinelvault/gen/vault/v1;vaultv1";

message Secret {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string status = 4;
}

message ListSecretsRequest {
  string org_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListSecretsResponse {
  repeated Secret items = 1;
}

service SecretService {
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
}
