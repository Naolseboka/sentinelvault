syntax = "proto3";

package sentinelvault.vault.v1;

option go_package = "github.com/sentinelvault/sentinelvault/gen/vault/v1;vaultv1";

message Attachment {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string status = 4;
}

message ListAttachmentsRequest {
  string org_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListAttachmentsResponse {
  repeated Attachment items = 1;
}

service AttachmentService {
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse);
}
