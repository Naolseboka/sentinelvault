syntax = "proto3";

package sentinelvault.gateway.v1;

option go_package = "github.com/sentinelvault/sentinelvault/gen/gateway/v1;gatewayv1";

message Route {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string status = 4;
}

message ListRoutesRequest {
  string org_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListRoutesResponse {
  repeated Route items = 1;
}

service ApiGatewayService {
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
}
