syntax = "proto3";

package sentinelvault.identity.v1;

option go_package = "github.com/sentinelvault/sentinelvault/gen/identity/v1;identityv1";

message Device {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string status = 4;
}

message ListDevicesRequest {
  string org_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListDevicesResponse {
  repeated Device items = 1;
}

service DeviceService {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
}
