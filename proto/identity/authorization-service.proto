syntax = "proto3";

package sentinelvault.identity.v1;

option go_package = "github.com/sentinelvault/sentinelvault/gen/identity/v1;identityv1";

message Decision {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string status = 4;
}

message ListDecisionsRequest {
  string org_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListDecisionsResponse {
  repeated Decision items = 1;
}

service AuthorizationService {
  rpc ListDecisions(ListDecisionsRequest) returns (ListDecisionsResponse);
}
