apiVersion: apps/v1
kind: Deployment
metadata:
  name: otp-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otp-service
  template:
    metadata:
      labels:
        app: otp-service
    spec:
      containers:
        - name: otp-service
          image: sentinelvault/otp-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: otp-service
spec:
  selector:
    app: otp-service
  ports:
    - port: 8080
