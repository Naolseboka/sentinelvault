apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-service
  template:
    metadata:
      labels:
        app: risk-service
    spec:
      containers:
        - name: risk-service
          image: sentinelvault/risk-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: risk-service
spec:
  selector:
    app: risk-service
  ports:
    - port: 8080
