apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioning-service
  template:
    metadata:
      labels:
        app: provisioning-service
    spec:
      containers:
        - name: provisioning-service
          image: sentinelvault/provisioning-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: provisioning-service
spec:
  selector:
    app: provisioning-service
  ports:
    - port: 8080
