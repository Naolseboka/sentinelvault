apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: approval-service
  template:
    metadata:
      labels:
        app: approval-service
    spec:
      containers:
        - name: approval-service
          image: sentinelvault/approval-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: approval-service
spec:
  selector:
    app: approval-service
  ports:
    - port: 8080
