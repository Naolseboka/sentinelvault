apiVersion: networking.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: sentinelvault-mtls
  namespace: sentinelvault
spec:
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: gateway-only-ingress
  namespace: sentinelvault
spec:
  selector:
    matchLabels:
      app: api-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["istio-system"]
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: internal-services
  namespace: sentinelvault
spec:
  host: "*.sentinelvault.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
