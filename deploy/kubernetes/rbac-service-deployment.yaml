apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbac-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rbac-service
  template:
    metadata:
      labels:
        app: rbac-service
    spec:
      containers:
        - name: rbac-service
          image: sentinelvault/rbac-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: rbac-service
spec:
  selector:
    app: rbac-service
  ports:
    - port: 8080
