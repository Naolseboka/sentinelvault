apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: threat-service
  template:
    metadata:
      labels:
        app: threat-service
    spec:
      containers:
        - name: threat-service
          image: sentinelvault/threat-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: threat-service
spec:
  selector:
    app: threat-service
  ports:
    - port: 8080
