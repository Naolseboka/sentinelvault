apiVersion: apps/v1
kind: Deployment
metadata:
  name: password-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: password-service
  template:
    metadata:
      labels:
        app: password-service
    spec:
      containers:
        - name: password-service
          image: sentinelvault/password-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: password-service
spec:
  selector:
    app: password-service
  ports:
    - port: 8080
