apiVersion: apps/v1
kind: Deployment
metadata:
  name: certificate-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: certificate-service
  template:
    metadata:
      labels:
        app: certificate-service
    spec:
      containers:
        - name: certificate-service
          image: sentinelvault/certificate-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: certificate-service
spec:
  selector:
    app: certificate-service
  ports:
    - port: 8080
