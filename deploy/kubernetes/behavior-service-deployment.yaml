apiVersion: apps/v1
kind: Deployment
metadata:
  name: behavior-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: behavior-service
  template:
    metadata:
      labels:
        app: behavior-service
    spec:
      containers:
        - name: behavior-service
          image: sentinelvault/behavior-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: behavior-service
spec:
  selector:
    app: behavior-service
  ports:
    - port: 8080
