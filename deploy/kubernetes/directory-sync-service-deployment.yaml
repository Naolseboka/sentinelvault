apiVersion: apps/v1
kind: Deployment
metadata:
  name: directory-sync-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: directory-sync-service
  template:
    metadata:
      labels:
        app: directory-sync-service
    spec:
      containers:
        - name: directory-sync-service
          image: sentinelvault/directory-sync-service:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: directory-sync-service
spec:
  selector:
    app: directory-sync-service
  ports:
    - port: 8080
