name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Bootstrap check
        run: bash scripts/bootstrap-check.sh

      - name: go mod tidy
        run: go mod tidy

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test with coverage
        run: |
          go test -race -coverprofile=coverage.out ./internal/common/... ./internal/crypto/... ./internal/config/...
          go tool cover -func=coverage.out

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build api-gateway
        run: go build ./apps/api-gateway/cmd/
